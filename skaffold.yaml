apiVersion: skaffold/v4beta13
kind: Config
build:
  artifacts:
    - image: alibaba0010/auth
      context: server/auth
      sync:
        manual:
          - src: server/auth/src/**/*.ts
            dest: .
      docker:
        dockerfile: Dockerfile
    - image: alibaba0010/client
      context: client
      sync:
        manual:
          - src: "**/*.js"
            dest: .
      docker:
        dockerfile: Dockerfile
    - image: alibaba0010/tickets
      context: server/tickets
      sync:
        manual:
          - src: server/tickets/src/**/*.ts
            dest: .
      docker:
        dockerfile: Dockerfile
