apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-depl
spec:
  selector:
    matchLabels:
      app: orders
  replicas: 1
  template:
    metadata:
      labels:
        app: orders
    spec:
      initContainers:
        - name: wait-for-nats
          image: alpine:3.23
          command:
            - sh
            - -c
            - |
              apk add --no-cache netcat-openbsd bind-tools
              echo "Waiting for DNS resolution of nats-srv..."
              until nslookup nats-srv; do
                echo "DNS not ready..."
                sleep 2
              done

              echo "Waiting for NATS at nats-srv:4222..."
              until nc -zv -w 2 nats-srv 4222; do
                echo "NATS not ready..."
                sleep 2
              done
              echo "NATS is up."
      containers:
        - name: orders
          image: alibaba0010/orders:1 #goggle-cloud gcr.io
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: MONGO_URL
              value: "mongodb://orders-mongo-srv:27017/orders"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: "http://nats-srv:4222"
            - name: NATS_CLUSTER_ID
              value: ticketing

---
apiVersion: v1
kind: Service
metadata:
  name: orders-srv
spec:
  selector:
    app: orders
  ports:
    - name: orders
      protocol: TCP
      port: 3003
      targetPort: 3003
